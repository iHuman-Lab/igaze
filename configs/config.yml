    raw_saccades_csv: "outputs/eyetracking/saccades_long.csv"
    saccades_summary_csv: "outputs/eyetracking/saccades_summary.csv"

glmm:
  synthetic_conditions:
    enabled: true
    providers:
      - gemini
      - chatgpt
    prompts:
      - detailed
      - sparse
    provider_models:
      gemini: gemini-1.5-flash
      chatgpt: gpt-4o
